  /api/tasks/{id}/lifecycle-executions:
    get:
      description: Returns one bounded page of lifecycle hook invocations (routing,
        before-run preparation, after-complete learning) recorded for the given task.
        Results are newest-first; use next_cursor with before for older activity and
        the newest execution ID with after for live inserts.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Project ID
        in: query
        name: project_id
        type: string
      - description: Page size (default 20, maximum 50)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor for the next older page
        in: query
        name: before
        type: string
      - description: Newest execution ID or newer-page cursor
        in: query
        name: after
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/viewmodels.LifecycleExecutionPageView'
        "400":
          description: Invalid task ID or page cursor
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List lifecycle executions for a task
      tags:
      - Lifecycle
  /api/tasks/{id}/lifecycle-executions/{executionID}:
