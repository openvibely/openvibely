host: localhost:3001
info:
  contact:
    email: support@openvibely.dev
    name: API Support
    url: https://github.com/openvibely/openvibely
  description: |-
    REST API for OpenVibely - AI-powered task scheduling and management
    This API provides endpoints for managing projects, tasks, and chat interactions with AI agents.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: OpenVibely API
  version: "1.0"
paths:
  /api/alerts/pending-count:
    get:
      description: Returns the number of alerts whose decision state is pending for
        one project without rendering alert cards.
      parameters:
      - description: Project ID
        in: query
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Pending alert count
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Project ID is required
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get pending alert count
      tags:
      - alerts
  /api/analytics/agent-usage-by-project:
    get:
      description: Returns model usage, success count, and failure count grouped by
        project.
      parameters:
      - description: Project ID filter
        in: query
        name: project_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Model usage breakdown
          schema:
            items:
              $ref: '#/definitions/repository.AgentUsage'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get model usage by project
      tags:
      - analytics
  /api/analytics/avg-execution-time-by-agent:
    get:
      description: Returns average execution durations grouped by configured model.
      parameters:
      - description: Project ID filter
        in: query
        name: project_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Average execution time by model
          schema:
            items:
              $ref: '#/definitions/repository.AvgExecutionTime'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get average execution time by model
      tags:
      - analytics
  /api/analytics/avg-execution-time-by-task:
    get:
      description: Returns average task execution durations for completed executions.
      parameters:
      - description: Project ID filter
        in: query
        name: project_id
        type: string
      - default: 10
        description: Maximum number of tasks to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Average execution time by task
          schema:
            items:
              $ref: '#/definitions/repository.AvgExecutionTime'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get average execution time by task
      tags:
      - analytics
  /api/analytics/dashboard:
    get:
      description: Returns task-level outcome KPIs, definitions, comparisons, evidence,
        reusable Agent performance, observed skill outcomes, and workflow performance
        for one project.
      parameters:
      - description: Authoritative project ID
        in: query
        name: project_id
        required: true
        type: string
      - default: 30d
        description: 'Convenience range: 7d, 30d, 90d, 365d, month, all'
        in: query
        name: range
        type: string
      - description: Optional inclusive start datetime
        in: query
        name: date_from
        type: string
      - description: Optional exclusive end datetime
        in: query
        name: date_to
        type: string
      - description: Compare with the immediately preceding equivalent period
        in: query
        name: compare
        type: boolean
      - default: day
        description: 'Trend grouping: day, week, or month'
        in: query
        name: group_by
        type: string
      - description: Reusable Agent definition ID or __unassigned__
        in: query
        name: agent
        type: string
      - description: Automation workflow ID
        in: query
        name: workflow
        type: string
      - default: 20
        description: Evidence rows per page, 1-100
        in: query
        name: evidence_limit
        type: integer
      - default: 0
        description: Evidence rows to skip
        in: query
        name: evidence_offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Outcome Analytics dashboard
          schema:
            $ref: '#/definitions/models.AnalyticsDashboard'
        "400":
          description: Missing project ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      tags:
      - analytics
  /api/analytics/execution-trends-by-hour:
    get:
      description: Returns execution counts grouped by hour-of-day.
      parameters:
      - description: Project ID filter
        in: query
        name: project_id
        type: string
      - description: Optional start datetime filter
        in: query
        name: date_from
        type: string
      - description: Optional end datetime filter
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Execution counts by hour
          schema:
            items:
              $ref: '#/definitions/repository.ExecutionTrend'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get execution trends by hour
      tags:
      - analytics
  /api/analytics/failed-task-patterns:
    get:
      description: Returns task-level failure patterns with the latest observed error.
      parameters:
      - description: Project ID filter
        in: query
        name: project_id
        type: string
      - default: 10
        description: Maximum number of patterns to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Failed task patterns
          schema:
            items:
              $ref: '#/definitions/repository.FailedTaskPattern'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get failed task patterns
      tags:
      - analytics
  /api/analytics/most-frequent-tasks:
    get:
      description: Returns tasks ordered by execution count.
      parameters:
      - description: Project ID filter
        in: query
        name: project_id
        type: string
      - default: 10
        description: Maximum number of tasks to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Most frequently executed tasks
          schema:
            items:
              $ref: '#/definitions/repository.TaskFrequency'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get most frequent tasks
      tags:
      - analytics
  /api/analytics/skills:
    get:
      description: Returns skill usage over time, top skills, selection follow-through,
        agent heatmap, underused skill metrics, and bounded supporting skill events
        for an exact chart selection.
      parameters:
      - description: Project ID filter; required when requesting supporting skill
          evidence
        in: query
        name: project_id
        type: string
      - default: 30d
        description: 'Convenience range: 7d, 30d, 90d, 365d, all'
        in: query
        name: range
        type: string
      - default: day
        description: 'Usage trend grouping: day, week, or month'
        in: query
        name: group_by
        type: string
      - description: Agent ID filter
        in: query
        name: agent_id
        type: string
      - description: Surface filter
        in: query
        name: surface
        type: string
      - description: Skill scope filter
        in: query
        name: skill_scope
        type: string
      - description: Event type filter (selected, loaded, viewed, created, edited)
        in: query
        name: event_type
        type: string
      - description: Exact grouped period for supporting skill events
        in: query
        name: skill_period
        type: string
      - description: Supporting event type (used, followed, ignored, selected, loaded,
          viewed, created, edited)
        in: query
        name: skill_event
        type: string
      - description: Exact Agent ID or __unassigned__ for supporting skill events
        in: query
        name: skill_agent
        type: string
      - description: Exact skill handle for supporting skill events
        in: query
        name: skill_handle
        type: string
      - description: Exact skill scope for supporting skill events (global, project,
          agent_owned)
        in: query
        name: skill_evidence_scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Skill analytics
          schema:
            $ref: '#/definitions/models.SkillAnalyticsDashboard'
        "400":
          description: Supporting evidence requires project_id
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get skill analytics
      tags:
      - analytics
  /api/analytics/success-failure-rates:
    get:
      description: Returns execution success/failure rates grouped by day, week, or
        month.
      parameters:
      - description: Project ID filter
        in: query
        name: project_id
        type: string
      - default: day
        description: 'Grouping period: day, week, or month'
        in: query
        name: group_by
        type: string
      - description: Optional start datetime filter
        in: query
        name: date_from
        type: string
      - description: Optional end datetime filter
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success/failure rates
          schema:
            items:
              $ref: '#/definitions/repository.SuccessFailureRate'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get success/failure rates
      tags:
      - analytics
  /api/analytics/usage:
    get:
      description: Returns token/cache/reasoning/cost totals, daily usage, usage rate,
        model breakdowns, account limit snapshots, and bounded supporting usage events
        for an exact chart selection.
      parameters:
      - description: Project ID filter; required when requesting supporting usage
          evidence
        in: query
        name: project_id
        type: string
      - description: Provider filter
        in: query
        name: provider
        type: string
      - default: 30d
        description: 'Convenience range: 7d, 30d, 90d, 365d, month, all'
        in: query
        name: range
        type: string
      - default: day
        description: 'Usage rate grouping: hour, day, week, month'
        in: query
        name: group_by
        type: string
      - description: Optional start datetime filter
        in: query
        name: date_from
        type: string
      - description: Optional end datetime filter
        in: query
        name: date_to
        type: string
      - description: Exact grouped period for supporting usage events
        in: query
        name: usage_period
        type: string
      - description: Exact provider for supporting usage events
        in: query
        name: usage_provider
        type: string
      - description: Exact model for supporting usage events
        in: query
        name: usage_model_name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Usage analytics
          schema:
            $ref: '#/definitions/models.AnalyticsUsageViewModel'
        "400":
          description: Supporting evidence requires project_id
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get LLM usage analytics
      tags:
      - analytics
  /api/capacity/global:
    get:
      description: Returns global worker pool usage and available slots. max_workers=0
        means unlimited; any positive value is a finite ceiling without a product-level
        upper bound.
      produces:
      - application/json
      responses:
        "200":
          description: Global capacity information
          schema:
            $ref: '#/definitions/handler.GlobalCapacityResponse'
      summary: Get global worker capacity
      tags:
      - capacity
  /api/capacity/models:
    get:
      description: Returns worker capacity information for models that have explicit
        model-level limits.
      produces:
      - application/json
      responses:
        "200":
          description: Per-model capacity information
          schema:
            items:
              $ref: '#/definitions/handler.ModelCapacityResponse'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get model worker capacities
      tags:
      - capacity
  /api/capacity/models/{modelId}:
    get:
      description: Returns worker capacity information for a specific model configuration.
      parameters:
      - description: Model configuration ID
        in: path
        name: modelId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Model capacity information
          schema:
            $ref: '#/definitions/handler.ModelCapacityResponse'
        "404":
          description: Model not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get model worker capacity
      tags:
      - capacity
  /api/capacity/projects:
    get:
      description: Returns independent per-project worker capacity and queue information.
        A nil or zero max_workers means the project inherits the global pool; project
        capacity does not aggregate configured caps across projects.
      produces:
      - application/json
      responses:
        "200":
          description: Per-project capacity information
          schema:
            items:
              $ref: '#/definitions/handler.ProjectCapacityResponse'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get project worker capacities
      tags:
      - capacity
  /api/capacity/projects/{projectId}:
    get:
      description: Returns independent worker capacity and queue information for a
        project. max_workers is nil or zero when the project inherits the global pool;
        runtime admission still enforces actual global usage.
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Project capacity information
          schema:
            $ref: '#/definitions/handler.ProjectCapacityResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get project worker capacity
      tags:
      - capacity
  /api/chat/message:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Send a chat message to the AI agent with optional file attachments.
        Messages containing only spaces, tabs, or line breaks are rejected with HTTP 400.
        Returns 201 immediately with a message ID. The AI processes the message asynchronously.
        Poll GET /api/chat/message/{id} to check status and retrieve the response.
        Supported file types: Images (JPG, PNG, GIF, WebP), Documents (PDF, TXT, MD, CSV), Code (Go, Python, JS, TS, Rust, Java, C/C++, Ruby, PHP, Swift, Kotlin, Shell, SQL, HTML, CSS, SCSS, XML, JSON, YAML, TOML, INI, diff/patch)
        Maximum file size: 10 MB per file
        Maximum files per request: 10
      parameters:
      - description: Chat message text to send to the AI
        in: formData
        name: message
        required: true
        type: string
      - description: Project ID to associate with this chat message
        in: formData
        name: project_id
        required: true
        type: string
      - description: File attachments (screenshots, images, PDFs, text files)
        in: formData
        name: attachments
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Message accepted for async processing
          schema:
            $ref: '#/definitions/handler.ChatMessageAcceptedResponse'
        "400":
          description: Bad request - missing required fields or invalid input
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "413":
          description: File too large
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "415":
          description: Unsupported file type
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Send a chat message with optional file attachments (async)
      tags:
      - chat
  /api/chat/message/{id}:
    get:
      description: |-
        Poll this endpoint to check if an async chat message has completed processing.
        Returns the current status (processing, completed, failed) and the response when available.
      parameters:
      - description: Message/execution ID returned from POST /api/chat/message
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Message status and response
          schema:
            $ref: '#/definitions/handler.ChatMessageStatusResponse'
        "404":
          description: Message not found
          schema:
