name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Main test suite (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
      LINUX_DESKTOP_PACKAGES: >-
        pkg-config
        libgtk-3-dev
        libwebkit2gtk-4.1-dev
        libgtk-4-dev
        libwebkitgtk-6.0-dev
        libglib2.0-dev
        libsoup-3.0-dev

    steps:
      - name: Check out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare Linux desktop dependency cache
        id: linux-desktop-cache-key
        shell: bash
        run: |
          package_hash="$(printf '%s' "$LINUX_DESKTOP_PACKAGES" | sha256sum | cut -d' ' -f1)"
          runner_image="${ImageOS:-${RUNNER_OS}}-${ImageVersion:-unknown}-${RUNNER_ARCH}"
          metadata_date="$(date -u +%Y%m%d)"
          echo "key=linux-desktop-apt-v1-${runner_image}-${package_hash}" >> "$GITHUB_OUTPUT"
          echo "metadata_key=linux-desktop-apt-lists-v1-${runner_image}-${package_hash}-${metadata_date}" >> "$GITHUB_OUTPUT"

          mkdir -p "$HOME/.cache/openvibely-apt/archives/partial" "$HOME/.cache/openvibely-apt/lists/partial"

      - name: Restore Linux desktop dependency downloads
        id: linux-desktop-cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/openvibely-apt/archives/*.deb
          key: ${{ steps.linux-desktop-cache-key.outputs.key }}

      - name: Restore fresh Linux APT metadata
        id: linux-desktop-metadata-cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/openvibely-apt/lists
          key: ${{ steps.linux-desktop-cache-key.outputs.metadata_key }}

      - name: Prepare cached APT state
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/openvibely-apt/archives/partial" "$HOME/.cache/openvibely-apt/lists/partial"
          sudo chown -R _apt:"$(id -gn)" "$HOME/.cache/openvibely-apt/archives" "$HOME/.cache/openvibely-apt/lists"
          sudo chmod 0775 \
            "$HOME/.cache/openvibely-apt/archives" \
            "$HOME/.cache/openvibely-apt/archives/partial" \
            "$HOME/.cache/openvibely-apt/lists" \
            "$HOME/.cache/openvibely-apt/lists/partial"

      - name: Prefer stable Ubuntu APT mirror
        shell: bash
        run: |
          sudo sed -i \
            -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            -e 's|https://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          archives_directory="$HOME/.cache/openvibely-apt/archives"
          lists_directory="$HOME/.cache/openvibely-apt/lists"
          metadata_max_age_minutes=1440
          archive_cache_restore_outcome="${{ steps.linux-desktop-cache.outcome }}"
          metadata_cache_restore_outcome="${{ steps.linux-desktop-metadata-cache.outcome }}"
          archive_cache_hit="${{ steps.linux-desktop-cache.outputs.cache-hit }}"
          metadata_cache_hit="${{ steps.linux-desktop-metadata-cache.outputs.cache-hit }}"
          if [[ "$archive_cache_restore_outcome" != "success" ]]; then
            archive_cache_hit=false
          fi
          if [[ "$metadata_cache_restore_outcome" != "success" ]]; then
            metadata_cache_hit=false
          fi
          metadata_validation="cache-miss"
          if [[ "$metadata_cache_restore_outcome" != "success" ]]; then
            metadata_validation="restore-failed"
          fi
          metadata_fresh=false
          started_at=$SECONDS
          read -r -a packages <<< "$LINUX_DESKTOP_PACKAGES"
          apt_common_options=(
            -o Dir::State::lists="$lists_directory"
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          apt_install_options=(
            "${apt_common_options[@]}"
            -o Dir::Cache::archives="$archives_directory"
            -o APT::Keep-Downloaded-Packages=true
          )

          apt_install() {
            timeout 10m sudo apt-get "${apt_install_options[@]}" "$@" install -y "${packages[@]}"
          }

          if [[ "$metadata_cache_hit" == "true" ]] &&
            find "$lists_directory" -maxdepth 1 -type f -name '*InRelease' -mmin "-${metadata_max_age_minutes}" -print -quit | grep -q . &&
            sudo apt-get "${apt_common_options[@]}" -s install "${packages[@]}" >/dev/null; then
            metadata_fresh=true
            metadata_validation="fresh-preflight"
          elif [[ "$metadata_cache_hit" == "true" ]]; then
            metadata_validation="stale-or-invalid"
          fi

          if [[ "$archive_cache_hit" == "true" && "$metadata_fresh" == "true" ]]; then
            if ! apt_install --no-download; then
              metadata_validation="cached-install-failed+updated"
              timeout 5m sudo apt-get "${apt_common_options[@]}" update
              apt_install
            fi
          else
            timeout 5m sudo apt-get "${apt_common_options[@]}" update
            metadata_validation="${metadata_validation}+updated"
            apt_install
          fi
          echo "Linux desktop dependencies installed in $((SECONDS - started_at))s (archive cache hit: ${archive_cache_hit}, metadata cache hit: ${metadata_cache_hit}, metadata: ${metadata_validation})"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate templ files
        run: go run github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ) generate

      - name: Ensure generated files are committed
        run: git diff --exit-code

      - name: Run foundation tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./cmd/... $(go list ./internal/... | grep -Ev '/(handler|repository|service)(/|$)') -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-core-foundation.txt; then
            exit 0
          fi
          echo "Foundation coverage failed once; retrying the unchanged foundation test group."
          go test ./cmd/... $(go list ./internal/... | grep -Ev '/(handler|repository|service)(/|$)') -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-core-foundation.txt

      - name: Run handler tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./internal/handler/... -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-core-handler.txt; then
            exit 0
          fi
          echo "Handler coverage failed once; retrying the unchanged handler test group."
          go test ./internal/handler/... -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-core-handler.txt

      - name: Run repository tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./internal/repository/... -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-core-repository.txt; then
            exit 0
          fi
          echo "Repository coverage failed once; retrying the unchanged repository test group."
          go test ./internal/repository/... -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-core-repository.txt

      - name: Run service tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./internal/service/... -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-core-service.txt; then
            exit 0
          fi
          echo "Service coverage failed once; retrying the unchanged service test group."
          go test ./internal/service/... -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-core-service.txt

      - name: Run package tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./pkg/... -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pkg.txt; then
            exit 0
          fi
          echo "Package coverage failed once; retrying the unchanged package test group."
          go test ./pkg/... -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pkg.txt

      - name: Run component template tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/components -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-components.txt; then
            exit 0
          fi
          echo "Component template coverage failed once; retrying the unchanged component test group."
          go test ./web/templates/components -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-components.txt

      - name: Run layout template tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/layout -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-layout.txt; then
            exit 0
          fi
          echo "Layout template coverage failed once; retrying the unchanged layout test group."
          go test ./web/templates/layout -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-layout.txt

      - name: Run alert, analytics, and automation page tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^(TestAlerts|TestAlertDetail|TestSystemUpdate|TestAnalytics|TestAutomation)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-alerts.txt; then
            exit 0
          fi
          echo "Alert, analytics, and automation page coverage failed once; retrying the unchanged test group."
          go test ./web/templates/pages -run '^(TestAlerts|TestAlertDetail|TestSystemUpdate|TestAnalytics|TestAutomation)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-alerts.txt

      - name: Run navigation, drag, and Chat page tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^(TestBreadcrumb|TestTaskAndScheduleCards|TestScheduleCards|TestChat)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-navigation.txt; then
            exit 0
          fi
          echo "Navigation, drag, and Chat page coverage failed once; retrying the unchanged test group."
          go test ./web/templates/pages -run '^(TestBreadcrumb|TestTaskAndScheduleCards|TestScheduleCards|TestChat)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-navigation.txt

      - name: Run execution, insights, models, and navigation page tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^(TestExecution|TestInsight|TestInsights|TestCardPagination|TestModels|TestPrimary|TestSidebar|TestReconnect)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-execution.txt; then
            exit 0
          fi
          echo "Execution, insights, models, and navigation page coverage failed once; retrying the unchanged test group."
          go test ./web/templates/pages -run '^(TestExecution|TestInsight|TestInsights|TestCardPagination|TestModels|TestPrimary|TestSidebar|TestReconnect)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-execution.txt

      - name: Run schedule and settings page tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^(TestScheduleContent|TestScheduleCalendar|TestBuildTaskOccurrenceMap|TestGetScheduleID|TestSettings|TestChannel)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-schedule.txt; then
            exit 0
          fi
          echo "Schedule and settings page coverage failed once; retrying the unchanged test group."
          go test ./web/templates/pages -run '^(TestScheduleContent|TestScheduleCalendar|TestBuildTaskOccurrenceMap|TestGetScheduleID|TestSettings|TestChannel)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-schedule.txt

      - name: Run task detail and thread page tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^(TestTaskDetail|TestTaskThread)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-detail.txt; then
            exit 0
          fi
          echo "Task detail and thread page coverage failed once; retrying the unchanged test group."
          go test ./web/templates/pages -run '^(TestTaskDetail|TestTaskThread)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-detail.txt

      - name: Run task, backlog, and capacity page tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^(TestTasks|TestBacklog|TestCapacity)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-list.txt; then
            exit 0
          fi
          echo "Task, backlog, and capacity page coverage failed once; retrying the unchanged test group."
          go test ./web/templates/pages -run '^(TestTasks|TestBacklog|TestCapacity)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-list.txt

      - name: Run worker and project page tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^(TestWorker|TestSSE|TestProjectSelector)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-worker-project.txt; then
            exit 0
          fi
          echo "Worker and project page coverage failed once; retrying the unchanged test group."
          go test ./web/templates/pages -run '^(TestWorker|TestSSE|TestProjectSelector)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-worker-project.txt

      - name: Run task running-icon page test with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^TestTaskRunningIconSharesThemeAwareSendColorWithoutSuppressingHoverInChrome$' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-running-icon.txt; then
            exit 0
          fi
          echo "Task running-icon page coverage failed once; retrying the unchanged test."
          go test ./web/templates/pages -run '^TestTaskRunningIconSharesThemeAwareSendColorWithoutSuppressingHoverInChrome$' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-running-icon.txt

      - name: Run task card state-icon page test with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^TestTaskCardStateIconStaysVisibleWithLongTitleAtMobileWidthInChrome$' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-card-state-icon.txt; then
            exit 0
          fi
          echo "Task card state-icon page coverage failed once; retrying the unchanged test."
          go test ./web/templates/pages -run '^TestTaskCardStateIconStaysVisibleWithLongTitleAtMobileWidthInChrome$' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-card-state-icon.txt

      - name: Run task card request-metadata page test with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^TestTaskCardActionsOwnDirectRequestMetadata$' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-card-request-metadata.txt; then
            exit 0
          fi
          echo "Task card request-metadata page coverage failed once; retrying the unchanged test."
          go test ./web/templates/pages -run '^TestTaskCardActionsOwnDirectRequestMetadata$' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-card-request-metadata.txt

      - name: Run task card merge-menu page test with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^TestTaskCardMergeMenuDirectActionConflictRetryAndBoardRefreshInChrome$' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-card-merge-menu.txt; then
            exit 0
          fi
          echo "Task card merge-menu page coverage failed once; retrying the unchanged test."
          go test ./web/templates/pages -run '^TestTaskCardMergeMenuDirectActionConflictRetryAndBoardRefreshInChrome$' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-card-merge-menu.txt

      - name: Run task card kebab-menu page test with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^TestTaskCardKebabMenuEscapesCardAndRepositionsAtDropZoneBottomInChrome$' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-card-kebab-menu.txt; then
            exit 0
          fi
          echo "Task card kebab-menu page coverage failed once; retrying the unchanged test."
          go test ./web/templates/pages -run '^TestTaskCardKebabMenuEscapesCardAndRepositionsAtDropZoneBottomInChrome$' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-card-kebab-menu.txt

      - name: Run task board delete-all page test with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^TestTaskBoardDeleteAllConfirmationFlowInChrome$' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-board-delete-all.txt; then
            exit 0
          fi
          echo "Task board delete-all page coverage failed once; retrying the unchanged test."
          go test ./web/templates/pages -run '^TestTaskBoardDeleteAllConfirmationFlowInChrome$' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-board-delete-all.txt

      - name: Run responsive task board delete-all page test with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^TestTaskBoardDeleteAllConfirmationResponsiveInChrome$' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-board-delete-all-responsive.txt; then
            exit 0
          fi
          echo "Responsive task board delete-all page coverage failed once; retrying the unchanged test."
          go test ./web/templates/pages -run '^TestTaskBoardDeleteAllConfirmationResponsiveInChrome$' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-task-board-delete-all-responsive.txt

      - name: Run upcoming task page tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^TestUpcomingTask' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-upcoming-task.txt; then
            exit 0
          fi
          echo "Upcoming task page coverage failed once; retrying the unchanged test group."
          go test ./web/templates/pages -run '^TestUpcomingTask' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-upcoming-task.txt

      - name: Run Changes and worktree page tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_PERF: "1"
        run: |
          if go test ./web/templates/pages -run '^(TestTaskChanges|TestTaskWorktree|TestWorktree)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-changes.txt; then
            exit 0
          fi
          echo "Changes and worktree page coverage failed once; retrying the unchanged test group."
          go test ./web/templates/pages -run '^(TestTaskChanges|TestTaskWorktree|TestWorktree)' -count=1 -timeout 360s -coverpkg=./... -coverprofile=coverage-pages-changes.txt

      - name: Merge coverage reports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          profiles = [
              "coverage-core-foundation.txt",
              "coverage-core-handler.txt",
              "coverage-core-repository.txt",
              "coverage-core-service.txt",
              "coverage-pkg.txt",
              "coverage-components.txt",
              "coverage-layout.txt",
              "coverage-pages-alerts.txt",
              "coverage-pages-navigation.txt",
              "coverage-pages-execution.txt",
              "coverage-pages-schedule.txt",
              "coverage-pages-detail.txt",
              "coverage-pages-task-list.txt",
              "coverage-pages-worker-project.txt",
              "coverage-pages-task-running-icon.txt",
              "coverage-pages-task-card-state-icon.txt",
              "coverage-pages-task-card-request-metadata.txt",
              "coverage-pages-task-card-merge-menu.txt",
              "coverage-pages-task-card-kebab-menu.txt",
              "coverage-pages-task-board-delete-all.txt",
              "coverage-pages-task-board-delete-all-responsive.txt",
              "coverage-pages-upcoming-task.txt",
              "coverage-pages-changes.txt",
          ]
          mode = None
          order = []
          counts = {}
          for profile in profiles:
              for line in Path(profile).read_text().splitlines():
                  if not line:
                      continue
                  if line.startswith("mode:"):
                      current_mode = line.split(":", 1)[1].strip()
                      if mode is None:
                          mode = current_mode
                      elif current_mode != mode:
                          raise SystemExit(f"coverage mode mismatch in {profile}")
                      continue
                  location, statements, count = line.split()
                  key = (location, statements)
                  if key not in counts:
                      order.append(key)
                      counts[key] = 0
                  value = int(count)
                  if mode == "set":
                      counts[key] = max(counts[key], value)
                  else:
                      counts[key] += value

          if mode is None:
              raise SystemExit("coverage profiles are empty")
          with Path("coverage.txt").open("w") as output:
              output.write(f"mode: {mode}\n")
              for location, statements in order:
                  output.write(f"{location} {statements} {counts[(location, statements)]}\n")
          PY

      - name: Compile and test the Linux GTK3 desktop path
        run: go test -tags gtk3 ./cmd/desktop -count=1 -timeout 120s

      - name: Run browser performance regression
        run: go test ./web/templates/components -run '^TestLargeToolOutputHydrationIsLazyAndStatefulInChrome$' -count=1 -timeout 60s

      - name: Show coverage summary (excluding generated/fixture code)
        run: |
          grep -Ev '(_templ\.go:|^github.com/openvibely/openvibely/cmd/|^github.com/openvibely/openvibely/docs/|^github.com/openvibely/openvibely/internal/database/migrations/|^github.com/openvibely/openvibely/internal/update/testfixture/|^github.com/openvibely/openvibely/internal/service/workflow_service\.go:)' coverage.txt > coverage.filtered.out
          go tool cover -func=coverage.filtered.out | tail -1

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.filtered.out
          disable_search: true

  packaged-update:
    name: Packaged update (${{ matrix.os }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            experimental: false
          - os: ubuntu-24.04-arm
            arch: arm64
            experimental: false
          - os: macos-15-intel
            arch: amd64
            experimental: false
          - os: macos-latest
            arch: arm64
            experimental: false
          - os: windows-latest
            arch: amd64
            experimental: false
          - os: windows-11-arm
            arch: arm64
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Check out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            lsof \
            xvfb

      - name: Start Linux virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/openvibely-xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Configure Linux WebKit sandbox fallback
        if: runner.os == 'Linux'
        shell: bash
        run: echo "WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1" >> "$GITHUB_ENV"

      - name: Run native packaged-update tests
        shell: bash
        run: go test ./internal/update -count=1 -timeout 120s -coverpkg=./internal/update -coverprofile=coverage.update-native.out

      - name: Run binary packaged update E2E
        shell: bash
        env:
          OPENVIBELY_UPDATE_E2E: "1"
          OPENVIBELY_UPDATE_E2E_DISTRIBUTION: binary
          OPENVIBELY_UPDATE_E2E_EXPECTED_OS: ${{ runner.os }}
          OPENVIBELY_UPDATE_E2E_EXPECTED_ARCH: ${{ matrix.arch }}
        run: go test ./internal/update -run '^TestPackagedUpdateE2E$' -count=1 -timeout 420s -coverpkg=./internal/update -coverprofile=coverage.update-binary.out

      - name: Run desktop packaged update E2E
        shell: bash
        env:
          OPENVIBELY_UPDATE_E2E: "1"
          OPENVIBELY_UPDATE_E2E_DISTRIBUTION: desktop
          OPENVIBELY_UPDATE_E2E_REAL_DESKTOP: "1"
          OPENVIBELY_UPDATE_E2E_EXPECTED_OS: ${{ runner.os }}
          OPENVIBELY_UPDATE_E2E_EXPECTED_ARCH: ${{ matrix.arch }}
        run: go test ./internal/update -run '^TestPackagedUpdateE2E$' -count=1 -timeout 600s -coverpkg=./internal/update -coverprofile=coverage.update-desktop.out

      - name: Upload packaged-update coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.update-native.out,coverage.update-binary.out,coverage.update-desktop.out
          disable_search: true
          flags: packaged-update-${{ matrix.os }}-${{ matrix.arch }}
