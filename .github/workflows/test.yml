name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  LINUX_DESKTOP_PACKAGES: >-
    pkg-config
    libgtk-3-dev
    libwebkit2gtk-4.1-dev
    libgtk-4-dev
    libwebkitgtk-6.0-dev
    libglib2.0-dev
    libsoup-3.0-dev

jobs:
  test:
    name: Main test suite (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York

    steps:
      - name: Check out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare Linux desktop dependency cache
        id: linux-desktop-cache-key
        shell: bash
        run: |
          package_hash="$(printf '%s' "$LINUX_DESKTOP_PACKAGES" | sha256sum | cut -d' ' -f1)"
          runner_image="${ImageOS:-${RUNNER_OS}}-${ImageVersion:-unknown}-${RUNNER_ARCH}"
          metadata_date="$(date -u +%Y%m%d)"
          echo "key=linux-desktop-apt-v1-${runner_image}-${package_hash}" >> "$GITHUB_OUTPUT"
          echo "metadata_key=linux-desktop-apt-lists-v1-${runner_image}-${package_hash}-${metadata_date}" >> "$GITHUB_OUTPUT"

          mkdir -p "$HOME/.cache/openvibely-apt/archives/partial" "$HOME/.cache/openvibely-apt/lists/partial"

      - name: Restore Linux desktop dependency downloads
        id: linux-desktop-cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/openvibely-apt/archives/*.deb
          key: ${{ steps.linux-desktop-cache-key.outputs.key }}

      - name: Restore fresh Linux APT metadata
        id: linux-desktop-metadata-cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/openvibely-apt/lists
          key: ${{ steps.linux-desktop-cache-key.outputs.metadata_key }}

      - name: Prepare cached APT state
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/openvibely-apt/archives/partial" "$HOME/.cache/openvibely-apt/lists/partial"
          sudo chown -R _apt:"$(id -gn)" "$HOME/.cache/openvibely-apt/archives" "$HOME/.cache/openvibely-apt/lists"
          sudo chmod 0775 \
            "$HOME/.cache/openvibely-apt/archives" \
            "$HOME/.cache/openvibely-apt/archives/partial" \
            "$HOME/.cache/openvibely-apt/lists" \
            "$HOME/.cache/openvibely-apt/lists/partial"

      - name: Prefer stable Ubuntu APT mirror
        shell: bash
        run: |
          sudo sed -i \
            -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            -e 's|https://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          archives_directory="$HOME/.cache/openvibely-apt/archives"
          lists_directory="$HOME/.cache/openvibely-apt/lists"
          metadata_max_age_minutes=1440
          archive_cache_restore_outcome="${{ steps.linux-desktop-cache.outcome }}"
          metadata_cache_restore_outcome="${{ steps.linux-desktop-metadata-cache.outcome }}"
          archive_cache_hit="${{ steps.linux-desktop-cache.outputs.cache-hit }}"
          metadata_cache_hit="${{ steps.linux-desktop-metadata-cache.outputs.cache-hit }}"
          if [[ "$archive_cache_restore_outcome" != "success" ]]; then
            archive_cache_hit=false
          fi
          if [[ "$metadata_cache_restore_outcome" != "success" ]]; then
            metadata_cache_hit=false
          fi
          metadata_validation="cache-miss"
          if [[ "$metadata_cache_restore_outcome" != "success" ]]; then
            metadata_validation="restore-failed"
          fi
          metadata_fresh=false
          started_at=$SECONDS
          read -r -a packages <<< "$LINUX_DESKTOP_PACKAGES"
          apt_common_options=(
            -o Dir::State::lists="$lists_directory"
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          apt_install_options=(
            "${apt_common_options[@]}"
            -o Dir::Cache::archives="$archives_directory"
            -o APT::Keep-Downloaded-Packages=true
          )

          apt_install() {
            timeout 10m sudo apt-get "${apt_install_options[@]}" "$@" install -y "${packages[@]}"
          }

          if [[ "$metadata_cache_hit" == "true" ]] &&
            find "$lists_directory" -maxdepth 1 -type f -name '*InRelease' -mmin "-${metadata_max_age_minutes}" -print -quit | grep -q . &&
            sudo apt-get "${apt_common_options[@]}" -s install "${packages[@]}" >/dev/null; then
            metadata_fresh=true
            metadata_validation="fresh-preflight"
          elif [[ "$metadata_cache_hit" == "true" ]]; then
            metadata_validation="stale-or-invalid"
          fi

          if [[ "$archive_cache_hit" == "true" && "$metadata_fresh" == "true" ]]; then
            if ! apt_install --no-download; then
              metadata_validation="cached-install-failed+updated"
              timeout 5m sudo apt-get "${apt_common_options[@]}" update
              apt_install
            fi
          else
            timeout 5m sudo apt-get "${apt_common_options[@]}" update
            metadata_validation="${metadata_validation}+updated"
            apt_install
          fi
          echo "Linux desktop dependencies installed in $((SECONDS - started_at))s (archive cache hit: ${archive_cache_hit}, metadata cache hit: ${metadata_cache_hit}, metadata: ${metadata_validation})"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate templ files
        run: go run github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ) generate

      - name: Ensure generated files are committed
        run: git diff --exit-code

      - name: Validate browser test naming
        shell: bash
        run: |
          legacy_names="$(grep -REn --include='*_test.go' '^func Test.*InChrome\(' web/templates/components web/templates/pages | grep -Ev '^.*func TestBrowser(Functional|Performance)_' || true)"
          direct_browser_violations="$(
            awk '
              /^func Test/ {
                test_name = $2
                sub(/\(.*/, "", test_name)
              }
              /chatNavigationChromePath\(t\)|testChromePath\(t\)|runReconnectChromeFixture\(t,/ {
                if (test_name !~ /^TestBrowser(Functional|Performance)_/) {
                  print FILENAME ": " test_name
                }
              }
            ' web/templates/components/*_test.go web/templates/pages/*_test.go
          )"
          if [[ -n "$legacy_names" || -n "$direct_browser_violations" ]]; then
            echo "Browser tests must use TestBrowserFunctional_ or TestBrowserPerformance_."
            [[ -z "$legacy_names" ]] || echo "$legacy_names"
            [[ -z "$direct_browser_violations" ]] || echo "$direct_browser_violations"
            exit 1
          fi

      - name: Run all tests with coverage
        env:
          OPENVIBELY_SKIP_BROWSER_TESTS: "1"
        run: go test ./... -count=1 -timeout 600s -coverpkg=./... -coverprofile=coverage.txt

      - name: Run component functional browser tests
        run: go test ./web/templates/components -run '^TestBrowserFunctional_' -count=1 -timeout 180s

      - name: Run page functional browser tests
        run: go test ./web/templates/pages -run '^TestBrowserFunctional_' -count=1 -timeout 300s

      - name: Compile and test the Linux GTK3 desktop path
        run: go test -tags gtk3 ./cmd/desktop -count=1 -timeout 120s

      - name: Run browser performance regressions
        run: go test ./web/templates/components -run '^TestBrowserPerformance_' -count=1 -timeout 120s

      - name: Show coverage summary (excluding generated/fixture code)
        run: |
          ./scripts/filter-coverage.sh coverage.txt coverage.filtered.out
          go tool cover -func=coverage.filtered.out | tail -1

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.filtered.out
          disable_search: true

  packaged-update:
    name: Packaged update (${{ matrix.os }}, ${{ matrix.arch }})
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            experimental: false
          - os: ubuntu-24.04-arm
            arch: arm64
            experimental: false
          - os: macos-15-intel
            arch: amd64
            experimental: false
          - os: macos-latest
            arch: arm64
            experimental: false
          - os: windows-latest
            arch: amd64
            experimental: false
          - os: windows-11-arm
            arch: arm64
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Mark packaged-update Linux job execution start
        if: runner.os == 'Linux'
        id: packaged-linux-job-start
        shell: bash
        run: echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare Linux packaged-update dependency cache
        if: runner.os == 'Linux'
        id: packaged-linux-desktop-cache-key
        shell: bash
        run: |
          read -r -a packages <<< "$LINUX_DESKTOP_PACKAGES"
          packages+=(lsof xvfb)
          package_hash="$(printf '%s\n' "${packages[@]}" | sha256sum | cut -d' ' -f1)"
          runner_image="${ImageOS:-${RUNNER_OS}}-${ImageVersion:-unknown}-${RUNNER_ARCH}-${{ matrix.arch }}"
          metadata_date="$(date -u +%Y%m%d)"
          echo "key=packaged-linux-desktop-apt-v1-${runner_image}-${package_hash}-${metadata_date}" >> "$GITHUB_OUTPUT"
          echo "metadata_key=packaged-linux-desktop-apt-lists-v1-${runner_image}-${package_hash}-${metadata_date}" >> "$GITHUB_OUTPUT"
          echo "archive_restore_started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/.cache/openvibely-apt/archives/partial" "$HOME/.cache/openvibely-apt/lists/partial"

      - name: Restore packaged-update Linux desktop dependency downloads
        if: runner.os == 'Linux'
        id: packaged-linux-desktop-cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/openvibely-apt/archives/*.deb
          key: ${{ steps.packaged-linux-desktop-cache-key.outputs.key }}

      - name: Report packaged-update Linux archive cache restore time
        if: runner.os == 'Linux'
        id: packaged-linux-archive-restore-timing
        shell: bash
        run: |
          started_ns="${{ steps.packaged-linux-desktop-cache-key.outputs.archive_restore_started_ns }}"
          elapsed_ms=$((($(date +%s%N) - started_ns) / 1000000))
          echo "Linux desktop archive cache restore action elapsed: $((elapsed_ms / 1000)).$((elapsed_ms % 1000))s (cache hit: ${{ steps.packaged-linux-desktop-cache.outputs.cache-hit }})"
          echo "elapsed_ms=${elapsed_ms}" >> "$GITHUB_OUTPUT"

      - name: Mark packaged-update Linux metadata cache restore start
        if: runner.os == 'Linux'
        id: packaged-linux-metadata-restore-start
        shell: bash
        run: echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Restore fresh packaged-update Linux APT metadata
        if: runner.os == 'Linux'
        id: packaged-linux-desktop-metadata-cache
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/openvibely-apt/lists
          key: ${{ steps.packaged-linux-desktop-cache-key.outputs.metadata_key }}

      - name: Report packaged-update Linux metadata cache restore time
        if: runner.os == 'Linux'
        id: packaged-linux-metadata-restore-timing
        shell: bash
        run: |
          started_ns="${{ steps.packaged-linux-metadata-restore-start.outputs.started_ns }}"
          elapsed_ms=$((($(date +%s%N) - started_ns) / 1000000))
          echo "Linux desktop metadata cache restore action elapsed: $((elapsed_ms / 1000)).$((elapsed_ms % 1000))s (cache hit: ${{ steps.packaged-linux-desktop-metadata-cache.outputs.cache-hit }})"
          echo "elapsed_ms=${elapsed_ms}" >> "$GITHUB_OUTPUT"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        id: install-packaged-linux-desktop-dependencies
        shell: bash
        run: |
          archives_directory="$HOME/.cache/openvibely-apt/archives"
          lists_directory="$HOME/.cache/openvibely-apt/lists"
          metadata_max_age_minutes=1440
          archive_cache_restore_outcome="${{ steps.packaged-linux-desktop-cache.outcome }}"
          metadata_cache_restore_outcome="${{ steps.packaged-linux-desktop-metadata-cache.outcome }}"
          archive_cache_hit="${{ steps.packaged-linux-desktop-cache.outputs.cache-hit }}"
          metadata_cache_hit="${{ steps.packaged-linux-desktop-metadata-cache.outputs.cache-hit }}"
          if [[ "$archive_cache_restore_outcome" != "success" ]]; then
            archive_cache_hit=false
            sudo find "$archives_directory" -maxdepth 1 -type f -name '*.deb' -delete
          fi
          if [[ "$metadata_cache_restore_outcome" != "success" ]]; then
            metadata_cache_hit=false
          fi
          metadata_validation="cache-miss"
          if [[ "$metadata_cache_restore_outcome" != "success" ]]; then
            metadata_validation="restore-failed"
          fi
          metadata_fresh=false
          apt_refresh="no"
          online_install="no"
          started_ns="$(date +%s%N)"
          read -r -a packages <<< "$LINUX_DESKTOP_PACKAGES"
          packages+=(lsof xvfb)
          mkdir -p "$archives_directory/partial" "$lists_directory/partial"
          sudo chown -R _apt:"$(id -gn)" "$archives_directory" "$lists_directory"
          sudo chmod 0775 \
            "$archives_directory" \
            "$archives_directory/partial" \
            "$lists_directory" \
            "$lists_directory/partial"
          apt_common_options=(
            -o Dir::State::lists="$lists_directory"
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          apt_install_options=(
            "${apt_common_options[@]}"
            -o Dir::Cache::archives="$archives_directory"
            -o APT::Keep-Downloaded-Packages=true
          )

          apt_install() {
            timeout 10m sudo apt-get "${apt_install_options[@]}" "$@" install -y "${packages[@]}"
          }

          metadata_files=()
          while IFS= read -r metadata_file; do
            metadata_files+=("$metadata_file")
          done < <(find "$lists_directory" -maxdepth 1 -type f \( -name '*InRelease' -o -name '*_Release' \) -print)
          all_metadata_fresh=false
          if ((${#metadata_files[@]} > 0)); then
            all_metadata_fresh=true
            for metadata_file in "${metadata_files[@]}"; do
              if ! find "$metadata_file" -maxdepth 0 -type f -mmin "-${metadata_max_age_minutes}" -print -quit | grep -q .; then
                all_metadata_fresh=false
                break
              fi
            done
          fi
          if [[ "$metadata_cache_hit" == "true" && "$all_metadata_fresh" == "true" ]] &&
            sudo apt-get "${apt_common_options[@]}" -s install "${packages[@]}" >/dev/null; then
            metadata_fresh=true
            metadata_validation="all-release-metadata-fresh-preflight"
          elif [[ "$metadata_cache_hit" == "true" ]]; then
            metadata_validation="stale-or-invalid"
          fi

          if [[ "$metadata_cache_hit" != "true" || "$metadata_fresh" != "true" ]]; then
            sudo find "$lists_directory" -type f -delete
          fi
          archives_bytes_before="$(find "$archives_directory" -maxdepth 1 -type f -name '*.deb' -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          if [[ "$archive_cache_hit" == "true" && "$metadata_fresh" == "true" ]]; then
            if ! apt_install --no-download; then
              metadata_validation="cached-install-failed+updated"
              sudo find "$archives_directory" -maxdepth 1 -type f -name '*.deb' -delete
              archives_bytes_before=0
              sudo find "$lists_directory" -type f -delete
              timeout 5m sudo apt-get "${apt_common_options[@]}" update
              apt_refresh="yes"
              apt_install
              online_install="yes"
            fi
          else
            timeout 5m sudo apt-get "${apt_common_options[@]}" update
            apt_refresh="yes"
            metadata_validation="${metadata_validation}+updated"
            apt_install
            online_install="yes"
          fi
          metadata_elapsed_ms=$((($(date +%s%N) - started_ns) / 1000000))
          archives_bytes="$(find "$archives_directory" -maxdepth 1 -type f -name '*.deb' -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          apt_download_bytes=$((archives_bytes - archives_bytes_before))
          apt_downloads="no"
          if (( apt_download_bytes > 0 )); then
            apt_downloads="yes"
          fi
          lists_bytes="$(du -sb "$lists_directory" | cut -f1)"
          cache_payload_bytes=$((archives_bytes + lists_bytes))
          echo "Linux desktop dependencies installed in $((metadata_elapsed_ms / 1000)).$((metadata_elapsed_ms % 1000))s (archive cache hit: ${archive_cache_hit}, metadata cache hit: ${metadata_cache_hit}, metadata: ${metadata_validation}, APT refresh: ${apt_refresh}, online install: ${online_install}, package downloads: ${apt_downloads} (${apt_download_bytes} new archive bytes), cache payload: ${cache_payload_bytes} bytes)"
          {
            echo "dependency_elapsed_ms=${metadata_elapsed_ms}"
            echo "dependency_elapsed_seconds=$((metadata_elapsed_ms / 1000)).$((metadata_elapsed_ms % 1000))"
            echo "archive_payload_bytes=${archives_bytes}"
            echo "metadata_payload_bytes=${lists_bytes}"
            echo "cache_payload_bytes=${cache_payload_bytes}"
            echo "apt_refresh=${apt_refresh}"
            echo "apt_downloads=${apt_downloads}"
            echo "archive_cache_hit=${archive_cache_hit}"
            echo "metadata_cache_hit=${metadata_cache_hit}"
          } >> "$GITHUB_OUTPUT"

      - name: Mark packaged-update Linux archive cache save start
        if: runner.os == 'Linux'
        id: packaged-linux-archive-save-start
        shell: bash
        run: echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Save packaged-update Linux desktop dependency downloads
        if: runner.os == 'Linux' && success()
        id: packaged-linux-archive-save
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/openvibely-apt/archives/*.deb
          key: ${{ steps.packaged-linux-desktop-cache-key.outputs.key }}

      - name: Report packaged-update Linux archive cache save time
        if: runner.os == 'Linux'
        id: packaged-linux-archive-save-timing
        shell: bash
        run: |
          started_ns="${{ steps.packaged-linux-archive-save-start.outputs.started_ns }}"
          elapsed_ms=$((($(date +%s%N) - started_ns) / 1000000))
          payload_bytes="${{ steps.install-packaged-linux-desktop-dependencies.outputs.archive_payload_bytes }}"
          echo "Linux desktop archive cache save action elapsed: $((elapsed_ms / 1000)).$((elapsed_ms % 1000))s (archive payload: ${payload_bytes} bytes)"
          echo "elapsed_ms=${elapsed_ms}" >> "$GITHUB_OUTPUT"

      - name: Mark packaged-update Linux metadata cache save start
        if: runner.os == 'Linux'
        id: packaged-linux-metadata-save-start
        shell: bash
        run: echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Save packaged-update Linux APT metadata
        if: runner.os == 'Linux' && success()
        id: packaged-linux-metadata-save
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/openvibely-apt/lists
          key: ${{ steps.packaged-linux-desktop-cache-key.outputs.metadata_key }}

      - name: Report packaged-update Linux metadata cache save time
        if: runner.os == 'Linux'
        id: packaged-linux-metadata-save-timing
        shell: bash
        run: |
          started_ns="${{ steps.packaged-linux-metadata-save-start.outputs.started_ns }}"
          elapsed_ms=$((($(date +%s%N) - started_ns) / 1000000))
          payload_bytes="${{ steps.install-packaged-linux-desktop-dependencies.outputs.metadata_payload_bytes }}"
          echo "Linux desktop metadata cache save action elapsed: $((elapsed_ms / 1000)).$((elapsed_ms % 1000))s (metadata payload: ${payload_bytes} bytes)"
          echo "elapsed_ms=${elapsed_ms}" >> "$GITHUB_OUTPUT"

      - name: Measure packaged-update Linux saved cache artifact sizes
        if: runner.os == 'Linux'
        id: packaged-linux-cache-artifact-sizes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_CACHE_KEY: ${{ steps.packaged-linux-desktop-cache-key.outputs.key }}
          METADATA_CACHE_KEY: ${{ steps.packaged-linux-desktop-cache-key.outputs.metadata_key }}
        run: |
          cache_api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/caches"
          cache_response="unavailable"
          if ! cache_response="$(curl --silent --show-error --fail --get \
            --data-urlencode "ref=${GITHUB_REF}" \
            --data-urlencode "per_page=100" \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$cache_api_url" 2>/dev/null)"; then
            cache_response="unavailable"
          fi

          archive_artifact_bytes="unavailable"
          metadata_artifact_bytes="unavailable"
          if [[ "$cache_response" != "unavailable" ]]; then
            archive_artifact_bytes="$(jq -r --arg key "$ARCHIVE_CACHE_KEY" --arg ref "$GITHUB_REF" '
              [(.actions_caches // [])[] | select(.key == $key and .ref == $ref)]
              | if length == 0 then "unavailable" else (max_by(.created_at).size_in_bytes // "unavailable") end
            ' <<< "$cache_response")"
            metadata_artifact_bytes="$(jq -r --arg key "$METADATA_CACHE_KEY" --arg ref "$GITHUB_REF" '
              [(.actions_caches // [])[] | select(.key == $key and .ref == $ref)]
              | if length == 0 then "unavailable" else (max_by(.created_at).size_in_bytes // "unavailable") end
            ' <<< "$cache_response")"
          fi
          echo "Linux desktop saved cache artifact sizes (archive: ${archive_artifact_bytes} bytes, metadata: ${metadata_artifact_bytes} bytes)"
          {
            echo "archive_artifact_bytes=${archive_artifact_bytes}"
            echo "metadata_artifact_bytes=${metadata_artifact_bytes}"
          } >> "$GITHUB_OUTPUT"

      - name: Start Linux virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/openvibely-xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Configure Linux WebKit sandbox fallback
        if: runner.os == 'Linux'
        shell: bash
        run: echo "WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1" >> "$GITHUB_ENV"

      - name: Run native packaged-update tests
        shell: bash
        run: go test ./internal/update -count=1 -timeout 120s -coverpkg=./internal/update -coverprofile=coverage.update-native.out

      - name: Run binary packaged update E2E
        shell: bash
        env:
          OPENVIBELY_UPDATE_E2E: "1"
          OPENVIBELY_UPDATE_E2E_DISTRIBUTION: binary
          OPENVIBELY_UPDATE_E2E_EXPECTED_OS: ${{ runner.os }}
          OPENVIBELY_UPDATE_E2E_EXPECTED_ARCH: ${{ matrix.arch }}
        run: go test ./internal/update -run '^TestPackagedUpdateE2E$' -count=1 -timeout 420s -coverpkg=./internal/update -coverprofile=coverage.update-binary.out

      - name: Run desktop packaged update E2E
        shell: bash
        env:
          OPENVIBELY_UPDATE_E2E: "1"
          OPENVIBELY_UPDATE_E2E_DISTRIBUTION: desktop
          OPENVIBELY_UPDATE_E2E_REAL_DESKTOP: "1"
          OPENVIBELY_UPDATE_E2E_EXPECTED_OS: ${{ runner.os }}
          OPENVIBELY_UPDATE_E2E_EXPECTED_ARCH: ${{ matrix.arch }}
        run: go test ./internal/update -run '^TestPackagedUpdateE2E$' -count=1 -timeout 600s -coverpkg=./internal/update -coverprofile=coverage.update-desktop.out

      - name: Upload packaged-update coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.update-native.out,coverage.update-binary.out,coverage.update-desktop.out
          disable_search: true
          flags: packaged-update-${{ matrix.os }}-${{ matrix.arch }}

      - name: Record Linux packaged-update cache metrics
        if: runner.os == 'Linux'
        shell: bash
        run: |
          elapsed_seconds=$(($(date +%s) - ${{ steps.packaged-linux-job-start.outputs.started_epoch }}))
          dependency_pipeline_ms=$((
            ${{ steps.packaged-linux-archive-restore-timing.outputs.elapsed_ms }} +
            ${{ steps.packaged-linux-metadata-restore-timing.outputs.elapsed_ms }} +
            ${{ steps.install-packaged-linux-desktop-dependencies.outputs.dependency_elapsed_ms }} +
            ${{ steps.packaged-linux-archive-save-timing.outputs.elapsed_ms }} +
            ${{ steps.packaged-linux-metadata-save-timing.outputs.elapsed_ms }}
          ))
          dependency_pipeline_seconds="$((dependency_pipeline_ms / 1000)).$(printf '%03d' "$((dependency_pipeline_ms % 1000))")"
          {
            echo '## Linux packaged-update cache metrics'
            echo
            echo '| Metric | Value |'
            echo '| --- | ---: |'
            echo '| Dependency installation elapsed | ${{ steps.install-packaged-linux-desktop-dependencies.outputs.dependency_elapsed_seconds }} s |'
            echo "| Dependency pipeline elapsed (restore + install + save) | ${dependency_pipeline_seconds} s |"
            echo '| Archive cache restore elapsed | $(( ${{ steps.packaged-linux-archive-restore-timing.outputs.elapsed_ms }} / 1000 )).$(( ${{ steps.packaged-linux-archive-restore-timing.outputs.elapsed_ms }} % 1000 )) s |'
            echo '| Metadata cache restore elapsed | $(( ${{ steps.packaged-linux-metadata-restore-timing.outputs.elapsed_ms }} / 1000 )).$(( ${{ steps.packaged-linux-metadata-restore-timing.outputs.elapsed_ms }} % 1000 )) s |'
            echo '| Archive cache save elapsed | $(( ${{ steps.packaged-linux-archive-save-timing.outputs.elapsed_ms }} / 1000 )).$(( ${{ steps.packaged-linux-archive-save-timing.outputs.elapsed_ms }} % 1000 )) s |'
            echo '| Metadata cache save elapsed | $(( ${{ steps.packaged-linux-metadata-save-timing.outputs.elapsed_ms }} / 1000 )).$(( ${{ steps.packaged-linux-metadata-save-timing.outputs.elapsed_ms }} % 1000 )) s |'
            echo '| Archive cache hit | ${{ steps.install-packaged-linux-desktop-dependencies.outputs.archive_cache_hit }} |'
            echo '| Metadata cache hit | ${{ steps.install-packaged-linux-desktop-dependencies.outputs.metadata_cache_hit }} |'
            echo '| APT refresh performed | ${{ steps.install-packaged-linux-desktop-dependencies.outputs.apt_refresh }} |'
            echo '| APT package downloads | ${{ steps.install-packaged-linux-desktop-dependencies.outputs.apt_downloads }} |'
            echo '| Archive payload size | ${{ steps.install-packaged-linux-desktop-dependencies.outputs.archive_payload_bytes }} bytes |'
            echo '| Metadata payload size | ${{ steps.install-packaged-linux-desktop-dependencies.outputs.metadata_payload_bytes }} bytes |'
            echo '| Cache payload size (uncompressed) | ${{ steps.install-packaged-linux-desktop-dependencies.outputs.cache_payload_bytes }} bytes |'
            echo '| Archive saved cache artifact size | ${{ steps.packaged-linux-cache-artifact-sizes.outputs.archive_artifact_bytes }} |'
            echo '| Metadata saved cache artifact size | ${{ steps.packaged-linux-cache-artifact-sizes.outputs.metadata_artifact_bytes }} |'
            echo "| Runner execution elapsed from first step (not job UI duration) | ${elapsed_seconds} s |"
            echo
            echo 'Use the packaged-update job duration shown in Actions for whole-job p50/p95; this runner-side measurement begins immediately before checkout.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Linux packaged-update runner execution elapsed from first step: ${elapsed_seconds}s (whole-job duration is available in Actions job details)"
