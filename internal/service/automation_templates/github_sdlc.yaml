schema_version: 1
name: GitHub SDLC
description: Create GitHub suggestions, use assignment as approval, implement accepted issues, and open pull requests for review.
automation_type: github_sdlc
adapter_key: github_sdlc
nodes:
    - key: vision_suggestions
      name: Vision Suggestions
      type: trigger
      role: offering_manager
      config:
        category: scheduled
        clear_context_on_start: true
        enabled: true
        goal: ""
        priority: 2
        prompt: |-
            Review the configured project vision/source files and identify small, reviewable feature gaps.

            Open GitHub suggestion issues only. Use `github_create_issue` with the unprefixed labels `suggestion` and `feature`. Do not create implementation tasks and do not modify code.

            Start every issue body with this section before any technical analysis:
            ## Summary
            In 2-4 plain-language sentences, explain what is wrong or being suggested, give one concrete example of what a user would notice, and explain why it matters. Write this for a product user who has not read the code and does not know internal tool or symbol names.

            After the Summary, preserve the detailed information needed by an implementation agent: inspected component, evidence and concrete failure paths, expected versus actual behavior, risk, suggested implementation direction, acceptance criteria, relevant file/symbol references, and regression cases. Technical detail is useful and must not be omitted; it just must not come before the Summary.

            Pass the required category label in the github_create_issue labels argument; do not rely on body text to communicate the category.

            Include enough context for a human to approve, reject, or assign the issue. Do not list, search, or inspect existing GitHub issues for duplicate detection. Do not require a repository-wide issue or pull-request listing/search before publication. Do not block publication because such a listing/search is unavailable, unauthenticated, incomplete, or unpaginated. Call github_create_issue for each actionable finding with an idempotency_key built as finder-role:primary-file-or-component:stable-symbol-or-behavior. Reuse the exact key when the same finding is reworded or retried; never include a run ID, date, timestamp, or random value. The server performs trusted local duplicate prevention, and the server prevents duplicate Automation-created issues using trusted local state.
        repeat_interval: 1
        repeat_type: daily
        run_at: "09:00"
        skills: []
        source_files: []
        target_node_key: vision_suggestions
      position:
        x: 0
        "y": 0
    - key: bug_finder
      name: Bug Finder
      type: trigger
      role: bug_finder
      config:
        category: scheduled
        clear_context_on_start: true
        enabled: true
        goal: ""
        priority: 2
        prompt: |-
            You are the Bug Finder. Choose one focused project component or workflow to inspect this run. Vary the component over time instead of repeatedly auditing the same files.

            Look only for likely correctness defects, edge-case failures, broken behavior, or missing tests that indicate a bug. Require a concrete failure path, explain expected versus actual behavior, and identify the regression coverage needed to prove the fix. Do not report performance-only opportunities or code duplication without a demonstrated correctness defect.

            Open GitHub issues only using `github_create_issue` with the unprefixed label `bug`.

            Start every issue body with this section before any technical analysis:
            ## Summary
            In 2-4 plain-language sentences, explain what is wrong or being suggested, give one concrete example of what a user would notice, and explain why it matters. Write this for a product user who has not read the code and does not know internal tool or symbol names.

            After the Summary, preserve the detailed information needed by an implementation agent: inspected component, evidence and concrete failure paths, expected versus actual behavior, risk, suggested implementation direction, acceptance criteria, relevant file/symbol references, and regression cases. Technical detail is useful and must not be omitted; it just must not come before the Summary.

            Pass the required category label in the github_create_issue labels argument; do not rely on body text to communicate the category.

            Do not list, search, or inspect existing GitHub issues for duplicate detection. Do not require a repository-wide issue or pull-request listing/search before publication. Do not block publication because such a listing/search is unavailable, unauthenticated, incomplete, or unpaginated. Call github_create_issue for each actionable finding with an idempotency_key built as finder-role:primary-file-or-component:stable-symbol-or-behavior. Reuse the exact key when the same finding is reworded or retried; never include a run ID, date, timestamp, or random value. The server performs trusted local duplicate prevention, and the server prevents duplicate Automation-created issues using trusted local state.

            Do not modify code, do not create OpenVibely implementation tasks, and do not open PRs. The Dev Inbox will create implementation tasks later if a human accepts the issue by assigning it to the configured OpenVibely GitHub inbox identity.
        repeat_interval: 1
        repeat_type: daily
        run_at: "09:00"
        skills: []
        source_files: []
        target_node_key: bug_finder
      position:
        x: 0
        "y": 120
    - key: optimization_finder
      name: Optimization Finder
      type: trigger
      role: optimization_finder
      config:
        category: scheduled
        clear_context_on_start: true
        enabled: true
        goal: ""
        priority: 2
        prompt: |-
            You are the Optimization Finder. Choose one focused project component or workflow to inspect this run. Vary the component over time instead of repeatedly auditing the same files.

            Look only for measurable performance, latency, throughput, memory, build, or workflow efficiency bottlenecks. Require current evidence or a concrete measurement plan and define before-and-after criteria that would demonstrate improvement. Do not report correctness defects or code duplication unless they directly establish the measured optimization opportunity.

            Open GitHub issues only using `github_create_issue` with the unprefixed label `performance`.

            Start every issue body with this section before any technical analysis:
            ## Summary
            In 2-4 plain-language sentences, explain what is wrong or being suggested, give one concrete example of what a user would notice, and explain why it matters. Write this for a product user who has not read the code and does not know internal tool or symbol names.

            After the Summary, preserve the detailed information needed by an implementation agent: inspected component, evidence and concrete failure paths, expected versus actual behavior, risk, suggested implementation direction, acceptance criteria, relevant file/symbol references, and regression cases. Technical detail is useful and must not be omitted; it just must not come before the Summary.

            Pass the required category label in the github_create_issue labels argument; do not rely on body text to communicate the category.

            Do not list, search, or inspect existing GitHub issues for duplicate detection. Do not require a repository-wide issue or pull-request listing/search before publication. Do not block publication because such a listing/search is unavailable, unauthenticated, incomplete, or unpaginated. Call github_create_issue for each actionable finding with an idempotency_key built as finder-role:primary-file-or-component:stable-symbol-or-behavior. Reuse the exact key when the same finding is reworded or retried; never include a run ID, date, timestamp, or random value. The server performs trusted local duplicate prevention, and the server prevents duplicate Automation-created issues using trusted local state.

            Do not modify code, do not create OpenVibely implementation tasks, and do not open PRs. The Dev Inbox will create implementation tasks later if a human accepts the issue by assigning it to the configured OpenVibely GitHub inbox identity.
        repeat_interval: 1
        repeat_type: daily
        run_at: "09:00"
        skills: []
        source_files: []
        target_node_key: optimization_finder
      position:
        x: 0
        "y": 240
    - key: redundancy_finder
      name: Redundancy Finder
      type: trigger
      role: redundancy_finder
      config:
        category: scheduled
        clear_context_on_start: true
        enabled: true
        goal: ""
        priority: 2
        prompt: |-
            You are the Redundancy Finder. Choose one focused project component or workflow to inspect this run. Vary the component over time instead of repeatedly auditing the same files.

            Look only for demonstrated duplicated or redundant code, configuration, or workflow logic. Identify the repeated locations, explain why they represent the same responsibility, and propose the smallest safe consolidation without over-engineering. Do not report correctness defects or performance-only opportunities as redundancy findings.

            Open GitHub issues only using `github_create_issue` with the unprefixed label `duplication`.

            Start every issue body with this section before any technical analysis:
            ## Summary
            In 2-4 plain-language sentences, explain what is wrong or being suggested, give one concrete example of what a user would notice, and explain why it matters. Write this for a product user who has not read the code and does not know internal tool or symbol names.

            After the Summary, preserve the detailed information needed by an implementation agent: inspected component, evidence and concrete failure paths, expected versus actual behavior, risk, suggested implementation direction, acceptance criteria, relevant file/symbol references, and regression cases. Technical detail is useful and must not be omitted; it just must not come before the Summary.

            Pass the required category label in the github_create_issue labels argument; do not rely on body text to communicate the category.

            Do not list, search, or inspect existing GitHub issues for duplicate detection. Do not require a repository-wide issue or pull-request listing/search before publication. Do not block publication because such a listing/search is unavailable, unauthenticated, incomplete, or unpaginated. Call github_create_issue for each actionable finding with an idempotency_key built as finder-role:primary-file-or-component:stable-symbol-or-behavior. Reuse the exact key when the same finding is reworded or retried; never include a run ID, date, timestamp, or random value. The server performs trusted local duplicate prevention, and the server prevents duplicate Automation-created issues using trusted local state.

            Do not modify code, do not create OpenVibely implementation tasks, and do not open PRs. The Dev Inbox will create implementation tasks later if a human accepts the issue by assigning it to the configured OpenVibely GitHub inbox identity.
        repeat_interval: 1
        repeat_type: daily
        run_at: "09:00"
        skills: []
        source_files: []
        target_node_key: redundancy_finder
      position:
        x: 0
        "y": 360
    - key: issue
      name: GitHub Issue
      type: action
      role: create_github_issue
      config:
        instructions: Open one focused, reviewable GitHub issue.
        labels: []
      position:
        x: 220
        "y": 180
    - key: assignment
      name: Human Assignment
      type: human_gate
      role: github_assignment
      config:
        approval_method: github_assignment
      position:
        x: 440
        "y": 180
    - key: dev_inbox
      name: Dev Inbox
      type: trigger
      role: github_inbox
      config:
        category: scheduled
        clear_context_on_start: true
        enabled: true
        goal: ""
        priority: 2
        prompt: |-
            Check GitHub for implementation mailbox work and PR review feedback for this project.

            First call `github_forward_pr_feedback_to_tasks` to fetch new pull request comments, review summaries, and review comments from GitHub Authorized Users on OpenVibely-created task PRs. This tool forwards each new authorized feedback item to the linked implementation task thread and deduplicates previously forwarded feedback. If the tool reports missing feedback dependencies, report that PR feedback routing is unavailable but continue normal issue inbox polling.

            Always call `github_get_project_inbox` and call `github_list_assigned_issues` for every returned Authorized User. When PAT authentication is available, also call `github_list_my_assigned_issues` so issues assigned only to the PAT owner are included. Deduplicate issues by repository plus issue number before processing them. If GitHub credentials are missing, or neither a PAT owner nor an Authorized User can be scanned, stop and explain the missing configuration.

            Use the issue details returned by `github_list_assigned_issues` and `github_list_my_assigned_issues` directly when they include the issue number, URL, title, body, labels, assignees, and state needed for task creation. Do not call `github_get_issue` for every listed issue as a default step; after repository/issue deduplication, call it only for an explicit issue read or for the specific listed issue that is missing fields needed to create an accurate implementation task. Treat assignment to the PAT owner or configured Authorized User as the user's approval to start implementation work, even when the issue has no associated PR yet. Do not call `github_list_assigned_issues_with_prs` as a default eligibility gate; use it only if the user explicitly asks for a PR-associated-issues-only workflow.

            Treat an eligible issue as actionable when it is assigned to the PAT owner or configured Authorized Users. Optional labels such as `approved`, `feature`, `bug`, `performance`, or `duplication` may refine priority/scope, but do not require an `approved` label unless the user's workflow explicitly says to require one.

            Before creating anything, call `list_tasks` (a read-only, current-project task discovery tool) with the GitHub issue number and/or URL as the `query` to reconcile existing implementation work; if it returns a matching task, continue that task instead of creating a duplicate. For each actionable issue, create or continue a distinct visible OpenVibely implementation task for that GitHub issue. If no existing task is evident from available task/thread context, call `create_task` immediately with category=active; do not wait for an existing PR. A newly created Active task is submitted automatically. Do not call `execute_tasks` for a newly created Active task, because that can submit the same task twice. Set `source_github_issue_number` to the exact issue number returned by this inbox execution. Do not set `source_github_repo_url`; the server resolves Automation provenance from the selected project's configured repository URL, or from a GitHub remote in its local checkout when that URL is blank. Include the GitHub issue number, URL, title, body or acceptance notes, relevant labels, and assignment context in the task prompt, then call `set_task_goal` for the created or reconciled task so it implements the issue and opens/reuses a PR with `github_open_pull_request` when done. For a reconciled existing task, call `execute_tasks` only when `list_tasks` shows category Backlog or status failed/cancelled, and pass that exact existing task ID so approved implementation resumes. Never call `execute_tasks` for an Active pending, queued, running, or completed task. Do not leave approved implementation work in Backlog or merely reconcile a task without starting it when it still needs execution. Do not post status comments on GitHub issues. Add `task-created` / `in-progress` labels only after the task is confirmed started.

            Use unprefixed labels only, such as `task-created`, `in-progress`, `blocked`, `needs-human`, and `pr-opened`. Never use labels beginning with `openvibely:`.

            When implementation work is complete in a task branch, use `github_open_pull_request` for that task and include issue metadata so the task PR record stays linked. Do not use local `git push` or GitHub CLI as a fallback if the tool fails; report the tool error so GitHub token/API publication can be fixed.
        repeat_interval: 1
        repeat_type: daily
        run_at: "10:00"
        skills: []
        source_files: []
        target_node_key: dev_inbox
      position:
        x: 660
        "y": 270
    - key: implementation
      name: Implementation
      type: agent_task
      role: implementation
      config:
        category: active
        goal: ""
        priority: 2
        prompt: |-
            Implement the assigned GitHub issue in the current project.

            Read the issue and relevant project context, make the focused code or documentation changes needed to satisfy its acceptance criteria, and run the relevant build and tests. Keep the work tied to the source issue and use github_open_pull_request to open or reuse the reviewable pull request when implementation is complete. Supply pr_body with a concise factual Markdown summary of the changes and validation, followed by Closes #<source issue number>. Do not include task IDs, product or automation boilerplate, or process narration. Do not approve or merge the pull request, release, or deploy on a human's behalf.
        skills: []
        source_files: []
      position:
        x: 880
        "y": 270
    - key: open_pr
      name: Open Pull Request
      type: action
      role: open_pull_request
      config:
        base: ""
        draft: false
        instructions: Open a reviewable pull request linked to the source issue.
      position:
        x: 1100
        "y": 270
    - key: review
      name: Human Review
      type: human_gate
      role: pull_request_review
      config:
        approval_method: pull_request_review
      position:
        x: 1320
        "y": 270
    - key: completed
      name: Completed
      type: outcome
      role: completed
      config: {}
      position:
        x: 1540
        "y": 270
edges:
    - key: vision_to_issue
      from: vision_suggestions
      to: issue
      from_port: right
      to_port: left
    - key: bug_to_issue
      from: bug_finder
      to: issue
      from_port: right
      to_port: left
    - key: optimization_to_issue
      from: optimization_finder
      to: issue
      from_port: right
      to_port: left
    - key: redundancy_to_issue
      from: redundancy_finder
      to: issue
      from_port: right
      to_port: left
    - key: issue_to_assignment
      from: issue
      to: assignment
      from_port: right
      to_port: left
    - key: assignment_to_inbox
      from: assignment
      to: dev_inbox
      from_port: right
      to_port: left
      label: assigned
      condition:
        state: assigned
    - key: inbox_to_implementation
      from: dev_inbox
      to: implementation
      from_port: right
      to_port: left
    - key: implementation_to_pr
      from: implementation
      to: open_pr
      from_port: right
      to_port: left
    - key: pr_to_review
      from: open_pr
      to: review
      from_port: right
      to_port: left
    - key: review_to_completed
      from: review
      to: completed
      from_port: right
      to_port: left
