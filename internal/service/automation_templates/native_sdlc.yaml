schema_version: 1
name: Native SDLC
description: Find vision suggestions, bugs, optimizations, and redundancies; wait for native approval; and create visible implementation work.
automation_type: native_sdlc
adapter_key: native_sdlc
nodes:
    - key: vision_suggestions
      name: Vision Suggestions
      type: trigger
      role: offering_manager
      config:
        category: scheduled
        clear_context_on_start: true
        enabled: true
        goal: ""
        priority: 2
        model_config_id: default
        prompt: |-
            Choose one focused project component or workflow to inspect this run. First check whether root VISION.md exists; if it does, read it before choosing the finding. Compare the inspected area with VISION.md, configured project vision, or other source-of-truth files and identify small, reviewable gaps. Vary the component over time instead of repeatedly auditing the same files.

            Do not modify code and do not create implementation tasks. Do not list, search, or inspect GitHub issues for duplicate detection.

            Make the title and message understandable to a product user without source-code or internal tool knowledge. Start every notification body with this section before any technical analysis:
            ## Summary
            In 2-4 plain-language sentences, explain what is wrong or being suggested, give one concrete example of what a user would notice, and explain why it matters.

            After the Summary, preserve the detailed information needed by an implementation agent: inspected component, evidence and concrete failure paths, expected versus actual behavior, risk, suggested implementation direction, acceptance criteria, relevant file/symbol references, and regression cases. Technical detail is useful and must not be omitted; it just must not come before the Summary.

            Use create_notification with type product_suggestion for new findings.

            Before creating any notification, call `list_existing_automation_notifications`. Use the returned notification IDs, titles, types, and lifecycle states to avoid reporting work already covered by this Native SDLC Automation. Follow next_offset until it is zero before deciding no existing notification matches. If a candidate might match an existing notification, call `get_alert` for that notification and read the body. If it is covered, skip that candidate and keep searching for a different new finding. Try to create at most one new notification this run. Only call `create_notification` after you believe the finding is not already represented. If no new finding remains, report that no new notification was found.

            The notification remains pending until a human approves or rejects it on Alerts. Approval authorizes task creation only, not merge, release, or deployment.
        repeat_interval: 1
        repeat_type: daily
        run_at: "09:00"
        target_node_key: vision_suggestions
      position:
        x: 0
        "y": 0
    - key: bug_finder
      name: Bug Finder
      type: trigger
      role: bug_finder
      config:
        category: scheduled
        clear_context_on_start: true
        enabled: true
        goal: ""
        priority: 2
        model_config_id: default
        prompt: |-
            You are the Bug Finder. Choose one focused project component or workflow to inspect this run. Vary the component over time instead of repeatedly auditing the same files.

            Look only for likely correctness defects, edge-case failures, broken behavior, or missing regression coverage. Require a concrete failure path, explain expected versus actual behavior, and identify the regression coverage needed to prove the fix. Do not report performance-only opportunities or code duplication without a demonstrated correctness defect.

            Do not modify code and do not create implementation tasks. Do not list, search, or inspect GitHub issues for duplicate detection.

            Make the title and message understandable to a product user without source-code or internal tool knowledge. Start every notification body with this section before any technical analysis:
            ## Summary
            In 2-4 plain-language sentences, explain what is wrong or being suggested, give one concrete example of what a user would notice, and explain why it matters.

            After the Summary, preserve the detailed information needed by an implementation agent: inspected component, evidence and concrete failure paths, expected versus actual behavior, risk, suggested implementation direction, acceptance criteria, relevant file/symbol references, and regression cases. Technical detail is useful and must not be omitted; it just must not come before the Summary.

            Use create_notification with type bug_suggestion for new findings.

            Before creating any notification, call `list_existing_automation_notifications`. Use the returned notification IDs, titles, types, and lifecycle states to avoid reporting work already covered by this Native SDLC Automation. Follow next_offset until it is zero before deciding no existing notification matches. If a candidate might match an existing notification, call `get_alert` for that notification and read the body. If it is covered, skip that candidate and keep searching for a different new finding. Try to create at most one new notification this run. Only call `create_notification` after you believe the finding is not already represented. If no new finding remains, report that no new notification was found.

            The notification remains pending until a human approves or rejects it on Alerts. Approval authorizes task creation only, not merge, release, or deployment.
        repeat_interval: 1
        repeat_type: daily
        run_at: "09:00"
        target_node_key: bug_finder
      position:
        x: 0
        "y": 120
    - key: optimization_finder
      name: Optimization Finder
      type: trigger
      role: optimization_finder
      config:
        category: scheduled
        clear_context_on_start: true
        enabled: true
        goal: ""
        priority: 2
        model_config_id: default
        prompt: |-
            You are the Optimization Finder. Choose one focused project component or workflow to inspect this run. Vary the component over time instead of repeatedly auditing the same files.

            Look only for measurable performance, latency, throughput, memory, build, or workflow efficiency bottlenecks. Require current evidence or a concrete measurement plan and define before-and-after criteria that would demonstrate improvement. Do not report correctness defects or code duplication unless they directly establish the measured optimization opportunity.

            Do not modify code and do not create implementation tasks. Do not list, search, or inspect GitHub issues for duplicate detection.

            Make the title and message understandable to a product user without source-code or internal tool knowledge. Start every notification body with this section before any technical analysis:
            ## Summary
            In 2-4 plain-language sentences, explain what is wrong or being suggested, give one concrete example of what a user would notice, and explain why it matters.

            After the Summary, preserve the detailed information needed by an implementation agent: inspected component, evidence and concrete failure paths, expected versus actual behavior, risk, suggested implementation direction, acceptance criteria, relevant file/symbol references, and regression cases. Technical detail is useful and must not be omitted; it just must not come before the Summary.

            Use create_notification with type performance_suggestion for new findings.

            Before creating any notification, call `list_existing_automation_notifications`. Use the returned notification IDs, titles, types, and lifecycle states to avoid reporting work already covered by this Native SDLC Automation. Follow next_offset until it is zero before deciding no existing notification matches. If a candidate might match an existing notification, call `get_alert` for that notification and read the body. If it is covered, skip that candidate and keep searching for a different new finding. Try to create at most one new notification this run. Only call `create_notification` after you believe the finding is not already represented. If no new finding remains, report that no new notification was found.

            The notification remains pending until a human approves or rejects it on Alerts. Approval authorizes task creation only, not merge, release, or deployment.
        repeat_interval: 1
        repeat_type: daily
        run_at: "09:00"
        target_node_key: optimization_finder
      position:
        x: 0
        "y": 240
    - key: redundancy_finder
      name: Redundancy Finder
      type: trigger
      role: redundancy_finder
      config:
        category: scheduled
        clear_context_on_start: true
        enabled: true
        goal: ""
        priority: 2
        model_config_id: default
        prompt: |-
            You are the Redundancy Finder. Choose one focused project component or workflow to inspect this run. Vary the component over time instead of repeatedly auditing the same files.

            Look only for demonstrated duplicated or redundant code, configuration, or workflow logic. Identify the repeated locations, explain why they represent the same responsibility, and propose the smallest safe consolidation without over-engineering. Do not report correctness defects or performance-only opportunities as redundancy findings.

            Do not modify code and do not create implementation tasks. Do not list, search, or inspect GitHub issues for duplicate detection.

            Make the title and message understandable to a product user without source-code or internal tool knowledge. Start every notification body with this section before any technical analysis:
            ## Summary
            In 2-4 plain-language sentences, explain what is wrong or being suggested, give one concrete example of what a user would notice, and explain why it matters.

            After the Summary, preserve the detailed information needed by an implementation agent: inspected component, evidence and concrete failure paths, expected versus actual behavior, risk, suggested implementation direction, acceptance criteria, relevant file/symbol references, and regression cases. Technical detail is useful and must not be omitted; it just must not come before the Summary.

            Use create_notification with type maintenance_suggestion for new findings.

            Before creating any notification, call `list_existing_automation_notifications`. Use the returned notification IDs, titles, types, and lifecycle states to avoid reporting work already covered by this Native SDLC Automation. Follow next_offset until it is zero before deciding no existing notification matches. If a candidate might match an existing notification, call `get_alert` for that notification and read the body. If it is covered, skip that candidate and keep searching for a different new finding. Try to create at most one new notification this run. Only call `create_notification` after you believe the finding is not already represented. If no new finding remains, report that no new notification was found.

            The notification remains pending until a human approves or rejects it on Alerts. Approval authorizes task creation only, not merge, release, or deployment.
        repeat_interval: 1
        repeat_type: daily
        run_at: "09:00"
        target_node_key: redundancy_finder
      position:
        x: 0
        "y": 360
    - key: notification
      name: Pending Notification
      type: action
      role: create_notification
      config:
        instructions: Summarize the proposal that needs a human decision.
        notification_type: approval_request
      position:
        x: 220
        "y": 180
    - key: approval
      name: Human Approval
      type: human_gate
      role: native_approval
      config:
        approval_method: native_alert
      position:
        x: 440
        "y": 180
    - key: inbox
      name: Approved Inbox
      type: trigger
      role: native_inbox
      config:
        category: scheduled
        clear_context_on_start: true
        enabled: true
        goal: ""
        priority: 2
        model_config_id: default
        prompt: |-
            Process approved actionable notifications for this scheduled task's own project.

            Call list_alerts without project_id, using decision_state=approved, implementation_task_linked=false, a bounded limit, and stable pagination. Do not pass processing_state, read, type, or source: omitting those filters includes both read states and every recovery-eligible processing state. The runtime automatically uses this scheduled task's persisted project and Automation ownership. Never reuse a project ID from prior messages, examples, memory, or tool output. Before calling claim_alert, collect every eligible result from all pages by following the returned pagination offsets. Do not claim, link, or process any notification while paginating because linkage removes rows from this filtered result set and advancing an offset after mutation can skip notifications. Only after the complete paginated snapshot is collected, call get_alert for each collected notification and inspect the full body and metadata before claiming it.

            Call claim_alert for each notification you can process. If the claim succeeds, call create_alert_implementation_task with a focused Backlog task title and prompt. The created task is the implementation task. Its prompt must include the notification ID, reviewed context, acceptance criteria, and directly instruct it to implement the reviewed change in its repository, add or update tests, and run the required validation. State that it is already the linked implementation task and must not create or look for another implementation task. It must begin implementation directly and must not run notification intake or call get_alert. Human approval authorizes creating and starting that implementation task; it does not authorize merge, release, deployment, destructive remediation, or credential changes. Do not use wording that says the created task lacks authorization to implement. The operation atomically links at most one task and is safe to retry after a crash. Use the implementation_task_id returned by that operation to call execute_tasks with that exact implementation task ID so approved work starts immediately. Do not leave the created task waiting in Backlog.

            Only after execute_tasks succeeds, call complete_alert_processing. If creation, linkage, or task execution fails, call fail_alert_processing with a concise error so the linked task can be inspected and recovered; do not report processing complete. Call release_alert_claim only when no task was linked and immediate retry by another scan is appropriate.
        repeat_interval: 1
        repeat_type: daily
        run_at: "10:00"
        target_node_key: inbox
      position:
        x: 660
        "y": 270
    - key: implementation
      name: Implementation
      type: agent_task
      role: implementation
      config:
        goal: ""
        model_config_id: default
      position:
        x: 880
        "y": 270
    - key: rejected
      name: Rejected
      type: outcome
      role: rejected
      config: {}
      position:
        x: 660
        "y": 90
    - key: completed
      name: Completed
      type: outcome
      role: completed
      config: {}
      position:
        x: 1100
        "y": 270
edges:
    - key: vision_to_notification
      from: vision_suggestions
      to: notification
      from_port: right
      to_port: left
    - key: bug_to_notification
      from: bug_finder
      to: notification
      from_port: right
      to_port: left
    - key: optimization_to_notification
      from: optimization_finder
      to: notification
      from_port: right
      to_port: left
    - key: redundancy_to_notification
      from: redundancy_finder
      to: notification
      from_port: right
      to_port: left
    - key: notification_to_approval
      from: notification
      to: approval
      from_port: right
      to_port: left
    - key: approval_to_rejected
      from: approval
      to: rejected
      from_port: right
      to_port: left
      label: rejected
      condition:
        state: rejected
    - key: approval_to_inbox
      from: approval
      to: inbox
      from_port: right
      to_port: left
      label: approved
      condition:
        state: approved
    - key: inbox_to_implementation
      from: inbox
      to: implementation
      from_port: right
      to_port: left
    - key: implementation_to_completed
      from: implementation
      to: completed
      from_port: right
      to_port: left
