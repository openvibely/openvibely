root = "."
tmp_dir = "/tmp/openvibely-air"
[build]
cmd = "templ generate && scripts/build-assets.sh && go build -o /tmp/openvibely-air/openvibely ./cmd/server"
bin = "/tmp/openvibely-air/openvibely"
full_bin = "/tmp/openvibely-air/openvibely"
delay = 1000
exclude_dir = [".git", ".openvibely", ".worktrees", "bin", "logs", "repos", "tmp", "uploads", "web/assets/.cache", "web/static/dist"]
exclude_file = []
exclude_regex = ["_test\\.go", ".*_templ\\.go"]
exclude_unchanged = false
follow_symlink = false
include_dir = []
include_ext = ["go", "templ", "html", "css", "js"]
kill_delay = "500ms"
log = "/tmp/openvibely-air/air-build.log"
poll = false
send_interrupt = true
stop_on_error = true
[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"
[log]
time = true
[misc]
clean_on_exit = true
[screen]
clear_on_rebuild = false
keep_scroll = true
