version: '3'

vars:
  APP_NAME: openvibely-desktop
  BIN_DIR: bin
  DESKTOP_PACKAGE: ./cmd/desktop
  CROSS_IMAGE: '{{.CROSS_IMAGE | default "wails-cross-amd64"}}'
  CROSS_PLATFORM: '{{.CROSS_PLATFORM | default "linux/amd64"}}'

tasks:
  setup:docker:
    summary: Builds the Wails cross-compilation Docker image used for Linux desktop builds on macOS.
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "Docker is required to build the Wails cross-compilation image."
    cmds:
      - |
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        wails3 generate build-assets \
          -name "OpenVibely" \
          -binaryname "{{.APP_NAME}}" \
          -productname "OpenVibely" \
          -productcompany "OpenVibely" \
          -productdescription "OpenVibely desktop application" \
          -productidentifier "com.openvibely.desktop" \
          -dir "$tmp"
        docker build --platform "{{.CROSS_PLATFORM}}" -t "{{.CROSS_IMAGE}}" -f "$tmp/docker/Dockerfile.cross" "$tmp/docker"

  build:
    summary: Builds the OpenVibely desktop application for GOOS/ARCH.
    cmds:
      - task: '{{.GOOS}}:build'
        vars:
          ARCH: '{{.ARCH}}'
          OUTPUT: '{{.OUTPUT}}'
          CGO_ENABLED: '{{.CGO_ENABLED}}'

  darwin:build:
    summary: Builds the macOS desktop binary.
    cmds:
      - mkdir -p "$(dirname "{{.OUTPUT}}")"
      - go build -trimpath -buildvcs=false -ldflags="${OPENVIBELY_DESKTOP_LDFLAGS:--s -w}" -o "{{.OUTPUT}}" {{.DESKTOP_PACKAGE}}
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{.OUTPUT | default .DEFAULT_OUTPUT}}'
    env:
      GOOS: darwin
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 1
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  windows:build:
    summary: Builds the Windows desktop executable.
    cmds:
      - mkdir -p "$(dirname "{{.OUTPUT}}")"
      - go build -trimpath -buildvcs=false -ldflags="${OPENVIBELY_DESKTOP_LDFLAGS:--s -w -H windowsgui}" -o "{{.OUTPUT}}" {{.DESKTOP_PACKAGE}}
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
      OUTPUT: '{{.OUTPUT | default .DEFAULT_OUTPUT}}'
    env:
      GOOS: windows
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'

  linux:build:
    summary: Builds the Linux desktop binary, using Wails Docker support when needed.
    cmds:
      - task: '{{if and (eq OS "linux") (eq .HAS_CC "true") (eq .TARGET_ARCH ARCH)}}linux:build:native{{else}}linux:build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          OUTPUT: '{{.OUTPUT}}'
    vars:
      TARGET_ARCH: '{{.ARCH | default ARCH}}'
      HAS_CC:
        sh: 'wails3 tool has "gcc|clang"'

  linux:build:native:
    internal: true
    summary: Builds the Linux desktop binary on a Linux host.
    cmds:
      - mkdir -p "$(dirname "{{.OUTPUT}}")"
      - go build -tags gtk3 -trimpath -buildvcs=false -ldflags="${OPENVIBELY_DESKTOP_LDFLAGS:--s -w}" -o "{{.OUTPUT}}" {{.DESKTOP_PACKAGE}}
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{.OUTPUT | default .DEFAULT_OUTPUT}}'
    env:
      GOOS: linux
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 1

  linux:build:docker:
    internal: true
    summary: Builds the Linux desktop binary with the Wails cross-compilation Docker image.
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "Docker is required for Linux desktop cross-compilation."
      - sh: docker image inspect {{.CROSS_IMAGE}} >/dev/null 2>&1
        msg: "Docker image '{{.CROSS_IMAGE}}' not found. Build it first with: wails3 task setup:docker"
    cmds:
      - mkdir -p "$(dirname "{{.OUTPUT}}")"
      - |
        docker run --rm \
          --platform "linux/{{.DOCKER_ARCH}}" \
          -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} \
          -e GOOS=linux \
          -e GOARCH="{{.DOCKER_ARCH}}" \
          -e CGO_ENABLED=1 \
          -e PATH="/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
          -e OPENVIBELY_DESKTOP_LDFLAGS="${OPENVIBELY_DESKTOP_LDFLAGS:--s -w}" \
          --entrypoint /bin/sh \
          "{{.CROSS_IMAGE}}" \
          -lc 'cd /app && /usr/local/go/bin/go build -tags gtk3 -trimpath -buildvcs=false -ldflags="$OPENVIBELY_DESKTOP_LDFLAGS" -o "{{.OUTPUT}}" {{.DESKTOP_PACKAGE}}'
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) "/app/$(dirname "{{.OUTPUT}}")"
        platforms: [linux, darwin]
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{.OUTPUT | default .DEFAULT_OUTPUT}}'
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'
